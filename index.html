<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moments Birthday — Fixed V4</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;700&display=swap');*{box-sizing:border-box}html,body{margin:0;background:#08060a;color:#fff;font-family:'DM Sans',sans-serif}.v{min-height:100svh;display:none}.on{display:flex}.builder{background:radial-gradient(circle at 50% 0,#55293d,#08060a 58%);align-items:center;justify-content:center;padding:20px}.card{width:min(700px,100%);background:#140e17e8;border:1px solid #fff2;border-radius:28px;padding:25px;box-shadow:0 30px 100px #0009}.serif{font-family:'Cormorant Garamond',serif}h1{font:500 clamp(48px,11vw,80px)/.9 'Cormorant Garamond',serif;margin:12px 0 20px}h2{font:500 36px 'Cormorant Garamond',serif}.muted{color:#cdbec6;line-height:1.6}.steps{display:flex;gap:5px}.steps i{height:3px;flex:1;background:#fff2}.steps i.a{background:#ef91ac}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:16px 0}.field label{display:block;font:700 11px 'DM Sans';letter-spacing:1.5px;text-transform:uppercase;color:#cbb5c0;margin-bottom:7px}input,textarea{width:100%;padding:14px;border-radius:13px;border:1px solid #fff2;background:#09070c;color:#fff}textarea{min-height:130px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}.btn{border:1px solid #fff2;border-radius:999px;padding:14px 20px;background:#fff1;color:#fff;font-weight:700}.main{background:linear-gradient(135deg,#f19ab3,#c65c84);border:0}.cakes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pick{padding:20px 8px;border-radius:20px;border:1px solid #fff2;background:#fff1;color:#fff}.pick b{font-size:55px;display:block}.pick.sel{border-color:#ef91ac;background:#ef91ac18}.rr{display:flex;gap:8px;margin:8px 0}.rr input{flex:1}.craft{background:radial-gradient(circle,#55293d,#08060a 65%);align-items:center;justify-content:center;text-align:center}.orb{width:130px;height:130px;border:1px solid #fff2;border-radius:50%;display:grid;place-items:center;font-size:55px;margin:auto;animation:p 2s infinite}@keyframes p{50%{transform:scale(1.08);box-shadow:0 0 100px #e98aa655}}#story{background:#08060a}.scene{position:absolute;inset:0;width:100%;height:100svh;min-height:100svh;display:none;overflow:hidden;padding:50px 20px 70px;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(circle at 50% 12%,#54283d,#0d0810 58%,#050408);animation:fade .7s}.scene.show{display:flex}@keyframes fade{from{opacity:0;transform:scale(1.02)}to{opacity:1;transform:none}}.k{font:700 10px 'DM Sans';letter-spacing:3px;text-transform:uppercase;color:#f2b7c7}.name{font:500 clamp(65px,18vw,150px)/.75 'Cormorant Garamond',serif;margin:25px 0;text-shadow:0 25px 70px #000}.story{font:500 clamp(23px,5vw,35px)/1.3 'Cormorant Garamond',serif;max-width:650px}.arrow{width:min(620px,100%);height:240px;position:relative;margin:20px}.arrow.shot .shaft{animation:shoot .6s ease forwards}.arrow.shot .bow{animation:bowMove .6s ease forwards}@keyframes shoot{to{transform:translateX(380px) rotate(-13deg);opacity:0}}@keyframes bowMove{to{transform:rotate(-18deg)}}.bow{position:absolute;left:12%;top:25px;width:170px;height:200px;border-right:4px solid #e8c6b1;border-radius:50%;transform:rotate(-13deg)}.shaft{position:absolute;left:25%;top:112px;width:290px;height:3px;background:#ead7cf;transform:rotate(-13deg);transform-origin:left}.shaft:after{content:'';position:absolute;right:-2px;top:-7px;border-left:14px solid #ead7cf;border-top:8px solid transparent;border-bottom:8px solid transparent}.arrow small{position:absolute;right:6%;bottom:5px;color:#c9b7c0}.cake{font-size:130px;user-select:none;filter:drop-shadow(0 30px 30px #000)}.balloons{position:relative;width:min(600px,100%);height:430px;margin:18px auto;overflow:hidden}.balloon{position:absolute;width:112px;height:135px;min-height:0;border:0;border-radius:52%;background:radial-gradient(circle at 32% 25%,#fff9,#fff0 18%),linear-gradient(150deg,#ed9ab6,#9d486d);color:#fff;font-weight:700;box-shadow:0 22px 45px #0007;transition:.5s}.balloon.popped{transform:scale(1.35) rotate(30deg);opacity:0;pointer-events:none}.reveal{min-height:50px;font:500 27px 'Cormorant Garamond';color:#ffdce7}.memory{width:min(650px,100%)}.memory img{width:100%;max-height:65svh;object-fit:cover;border-radius:24px}.caption{font:500 25px 'Cormorant Garamond';margin-top:12px}.env{width:min(500px,100%);height:300px;background:#f0e1c9;position:relative;box-shadow:0 35px 90px #0008;cursor:pointer}.env:before{content:'';position:absolute;inset:0;background:#f7ead7;clip-path:polygon(0 0,50% 55%,100% 0)}.seal{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);width:70px;height:70px;border-radius:50%;background:#9b3c50;display:grid;place-items:center;z-index:2;font-size:28px}.paper{display:none;background:#fff7eb;color:#3b2930;width:min(600px,100%);padding:35px;text-align:left}.paper.open{display:block;animation:fade .8s}.paper p{font:400 21px/1.8 'Cormorant Garamond';white-space:pre-wrap}.final h1{font-size:clamp(60px,15vw,120px)}#cf{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}.c{position:absolute;width:8px;height:14px;animation:fall 3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(900deg);opacity:0}}#music{position:fixed;right:15px;top:15px;z-index:120;display:none;border:1px solid #fff3;background:#0008;color:#fff;border-radius:999px;padding:10px 14px}@media(max-width:540px){.row,.cakes{grid-template-columns:1fr}.balloon{width:92px;height:115px}.balloons{height:390px}.bow{left:5%}.shaft{left:20%;width:255px}}
</style></head><body>
<section id="builder" class="v on builder"><div class="card"><div style="text-align:center;letter-spacing:4px;font-size:11px;color:#efb0c2">MOMENTS • BIRTHDAY</div><div class="steps" id="steps"></div><div id="form"></div></div></section>
<section id="craft" class="v craft"><div><div class="orb">🎁</div><h1>Making something<br>just for them…</h1><p class="muted">Folding the letter · lighting the candles · arranging the memories</p></div></section>
<section id="story" class="v"><div id="scenes"></div></section><button id="musicBtn" onclick="toggleAudio()">♪ Music</button><div id="cf"></div><audio id="audio" loop></audio>
<script>
let d={to:'',from:'',date:'',cake:'classic',reasons:['Your smile','The way you care','Our ridiculous conversations','You make ordinary days special'],photos:[],letter:'',music:'',musicFile:''},step=1,files=[],mem=0;
const S=[()=>`<div class=k>01 • The person</div><h1>Who is this<br>little world for?</h1><p class=muted>Tell us who deserves the surprise.</p><div class=row><div class=field><label>Their name</label><input id=to value="${E(d.to)}" placeholder="Ananya"></div><div class=field><label>Your name</label><input id=from value="${E(d.from)}" placeholder="Rahul"></div></div><div class=field><label>Birthday</label><input id=date type=date value="${d.date}"></div><div class=actions>${step>1?'<button class="btn" onclick=backStep()>← Back</button>':''}<button class="btn main" onclick=next()>Continue →</button></div>`,()=>`<div class=k>02 • The cake</div><h1>Pick their<br>birthday cake.</h1><div class=cakes>${[['classic','🎂'],['heart','💗'],['cup','🧁']].map(a=>`<button class="pick ${d.cake==a[0]?'sel':''}" onclick="d.cake='${a[0]}';render()"><b>${a[1]}</b>${a[0]}</button>`).join('')}</div><div class=actions>${step>1?'<button class="btn" onclick=backStep()>← Back</button>':''}<button class="btn main" onclick=next()>Continue →</button></div>`,()=>`<div class=k>03 • Hidden messages</div><h1>Put little reasons<br>inside balloons.</h1><div id=rl>${d.reasons.map(r=>`<div class=rr><input class=reason value="${E(r)}"><button class=btn onclick="this.parentElement.remove()">×</button></div>`).join('')}</div><div class=actions><button class=btn onclick=addR()>+ Add</button><button class="btn main" onclick=next()>Continue →</button></div>`,()=>`<div class=k>04 • Memories</div><h1>Choose the moments<br>worth keeping.</h1><p class=muted>Add up to five photos.</p><div class=field><input id=photos type=file accept="image/*" multiple></div><p class=muted>${files.length?files.length+' photo(s) selected.':''}</p><div class=actions><button class="btn main" onclick=next()>Continue →</button></div>`,()=>`<div class=k>05 • The letter</div><h1>Say the thing<br>you can't shorten.</h1><div class=field><label>Birthday letter</label><textarea id=letter maxlength=1800>${E(d.letter)}</textarea></div><div class=field><label>Music URL (.mp3/.ogg)</label><input id=music value="${E(d.music||'')}" placeholder="https://.../song.mp3"></div><div class=field><label>Or upload MP3 / OGG from your phone</label><input id=musicFile type=file accept="audio/mpeg,audio/ogg,.mp3,.ogg"></div><p id=musicStatus class=muted>Choose a URL or an audio file.</p><p class=muted>Mobile browsers require a user interaction before background audio can begin.</p><div class=actions><button class="btn main" onclick=finish()>Create their surprise ✨</button></div>`];
function E(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function render(){const stepsEl=document.getElementById("steps"),formEl=document.getElementById("form");stepsEl.innerHTML=[1,2,3,4,5].map(i=>`<i class="${i<=step?'a':''}"></i>`).join('');formEl.innerHTML=S[step-1]();if(step==4)document.getElementById('photos').onchange=async e=>{files=[];for(const f of [...e.target.files].slice(0,5))files.push({src:await read(f),caption:f.name.replace(/\.[^.]+$/,'').replaceAll('_',' ')});render()}}function read(f){return new Promise(r=>{let q=new FileReader;q.onload=()=>r(q.result);q.readAsDataURL(f)})}function save(){if(step==1){const toEl=document.getElementById('to'),fromEl=document.getElementById('from'),dateEl=document.getElementById('date');d.to=toEl.value.trim()||'Birthday Star';d.from=fromEl.value.trim()||'Someone who loves you';d.date=dateEl.value}if(step==3)d.reasons=[...document.querySelectorAll('.reason')].map(x=>x.value.trim()).filter(Boolean)}function backStep(){save();if(step>1){step--;render()}}
function next(){save();if(step<5){step++;render()}}function addR(){const list=document.getElementById('rl');let x=document.createElement('div');x.className='rr';x.innerHTML='<input class=reason placeholder="A reason..."><button class=btn onclick="this.parentElement.remove()">×</button>';list.appendChild(x)}async function finish(){
 try{
  save();
  const letterEl=document.getElementById('letter'), musicEl=document.getElementById('music'), fileEl=document.getElementById('musicFile');
  d.letter=letterEl.value.trim()||'I hope this year gives you beautiful moments and all the happiness you deserve.';
  d.music=musicEl.value.trim();
  if(fileEl && fileEl.files && fileEl.files[0]){ d.musicFile=await readFile(fileEl.files[0]); }
  d.photos=files;
  document.getElementById('builder').classList.remove('on');
  document.getElementById('craft').classList.add('on');
  setTimeout(launch,1800);
 }catch(err){console.error(err);alert('Could not create the surprise. Please refresh and try again.');}
}
function launch(){
 const craftEl=document.getElementById('craft'),storyEl=document.getElementById('story'),musicBtnEl=document.getElementById('musicBtn'),audioEl=document.getElementById('audio');
 craftEl.classList.remove('on');storyEl.classList.add('on');build();show(0);
 const src=d.music||d.musicFile;
 if(src){audioEl.src=src;musicBtnEl.style.display='block';}
}
function cake(){return d.cake=='heart'?'💗':d.cake=='cup'?'🧁':'🎂'}function build(){
 let h=`<div class="scene show" id=s0><div class=k>A little surprise</div><div class=name>${E(d.to)}</div><div class=story>Someone made something here that only makes sense if you're you.</div><button class="btn main" onclick="unlock()">Begin ✨</button></div>
 <div class=scene id=s1><div class=k>Pull the string</div><div class=story>A little arrow is waiting for you.</div><div class=arrow id=arrowStage><div class=bow></div><div class=shaft id=arrowShaft></div><button class="btn main" id=shootBtn type=button>Pull & release 🏹</button></div><p class=muted>Tap the button to pull and release the arrow.</p></div>
 <div class=scene id=s2><div class=k>For your birthday</div><div class=story>Make a wish before you blow out the candles.</div><div class=cake id=cakeTarget>${cake()}</div><div class=flames id=flameTarget>🔥 🔥 🔥</div><button class="btn main" id=wishBtn>Make my wish ✨</button></div>
 <div class=scene id=s3><div class=k>Little things</div><div class=story>Pop a balloon. Your message will appear below it.</div><div class=balloons id=balloonArea></div><div class=reveal id=reveal></div><button class="btn main" id=balloonNext>Continue →</button></div>`;
 if(d.photos.length)h+=`<div class=scene id=s4><div class=k>Memories</div><div class=story>A few moments I would choose again.</div><div class=memory id=memory>${d.photos.map((p,i)=>`<div class=ph style="display:${i?'none':'block'}"><img src="${p.src}"><div class=caption>${E(p.caption)}</div></div>`).join('')}<p id=counter>1 / ${d.photos.length}</p><button class=btn id=memNext>Next memory →</button></div></div>`;
 let l=d.photos.length?5:4;h+=`<div class=scene id=s${l}><div class=k>For you</div><div class=story>There's one thing left.</div><div class=env id=envelope><div class=seal>✦</div></div><p class=muted id=envHint>Tap the seal to open your letter.</p><div class=paper id=paper><div style="font:11px system-ui;letter-spacing:2px;text-transform:uppercase;color:#a26b7d">For ${E(d.to)}</div><p>${E(d.letter)}</p><div style="text-align:right;font-weight:bold">— ${E(d.from)}</div></div><button class="btn main" id=letterNext>Keep this moment →</button></div><div class="scene final" id=s${l+1}><div class=k>Happy Birthday</div><h1>For ${E(d.to)}.<br>Always.</h1><div class=story>May the next year give you more moments worth remembering than you can count.</div><button class="btn main" onclick="burst(90)">Celebrate again 🎉</button></div>`;
 document.getElementById('scenes').innerHTML=h;
 document.getElementById('shootBtn').onclick=()=>{document.getElementById('arrowStage').classList.add('shot');setTimeout(()=>show(2),650)};
 document.getElementById('wishBtn').onclick=()=>{document.getElementById('cakeTarget').style.transform='scale(1.1)';document.getElementById('flameTarget').textContent='✨ ✨ ✨';burst(45);setTimeout(()=>show(3),700)};
 setupBalloons();
 document.getElementById('balloonNext').onclick=()=>show(d.photos.length?4:4);
 if(d.photos.length)document.getElementById('memNext').onclick=nextMem;
 document.getElementById('envelope').onclick=()=>{document.getElementById('envelope').style.display='none';document.getElementById('envHint').style.display='none';document.getElementById('paper').classList.add('open');burst(30)};
 document.getElementById('letterNext').onclick=()=>show(l+1);
}
function setupBalloons(){
 const area=document.getElementById('balloonArea'), reveal=document.getElementById('reveal');
 const rs=(d.reasons.length?d.reasons:['You matter','Your smile','Our memories','Simply you']).slice(0,6);
 const pos=[[7,8],[39,0],[70,9],[20,50],[52,45],[76,53]];
 area.innerHTML='';
 rs.forEach((reason,i)=>{const b=document.createElement('button');b.className='balloon';b.type='button';b.textContent='POP ME';b.style.left=pos[i][0]+'%';b.style.top=pos[i][1]+'%';b.onclick=()=>{if(b.classList.contains('popped'))return;b.classList.add('popped');reveal.textContent=reason;reveal.classList.add('show');burst(12)};area.appendChild(b)});
}
function nextMem(){let p=[...document.querySelectorAll('.ph')];if(!p.length)return;p[mem].style.display='none';mem=(mem+1)%p.length;p[mem].style.display='block';document.getElementById('counter').textContent=(mem+1)+' / '+p.length}
function show(n){document.querySelectorAll('.scene').forEach(x=>x.classList.remove('show'));document.getElementById('s'+n).classList.add('show');scrollTo(0,0)}function unlock(){const a=document.getElementById('audio'),b=document.getElementById('musicBtn');if(a.src){a.play().then(()=>b.textContent='Ⅱ Music').catch(()=>{b.textContent='♪ Tap for music'})}show(1)}function shoot(){document.querySelector('.arrow').style.transform='translateX(170px)';setTimeout(()=>show(2),500)}function blow(x){x.style.transform='scale(1.1)';burst(45);setTimeout(()=>show(3),700)}function pop(x,i){x.classList.add('popped');const r=document.getElementById('reveal');r.textContent=d.reasons[i]||'You are loved.';burst(12)}function nextMem(){let p=[...document.querySelectorAll('.ph')];if(!p.length)return;p[mem].style.display='none';mem=(mem+1)%p.length;p[mem].style.display='block';document.getElementById('counter').textContent=(mem+1)+' / '+p.length}function openLetter(x){x.style.display='none';const p=document.getElementById('paper');p.classList.add('open');burst(30)}function burst(n=60){for(let i=0;i<n;i++){let x=document.createElement('i');x.className='c';x.style.left=Math.random()*100+'%';x.style.top='-20px';x.style.background=['#ef91ac','#ffd58c','#fff','#b99ce7'][Math.floor(Math.random()*4)];x.style.animationDelay=Math.random()*.8+'s';document.getElementById('cf').appendChild(x);setTimeout(()=>x.remove(),3500)}}function toggleAudio(){const a=document.getElementById('audio'),b=document.getElementById('musicBtn');if(!a.src){b.textContent='No music URL';return}if(a.paused){a.play().then(()=>b.textContent='Ⅱ Music').catch(()=>b.textContent='Tap again')}else{a.pause();b.textContent='♪ Music'}}window.addEventListener('error',e=>{console.error('Moments error:',e.error||e.message);});render();
</script></body></html>
